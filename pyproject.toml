[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "extraction-contracts"
version = "0.0.1"
description = "Review-stage foundations for controlled document-extraction regression tests"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Evekiio"}]
classifiers = ["Development Status :: 2 - Pre-Alpha", "Programming Language :: Python :: 3"]
dependencies = []

[project.scripts]
extraction-contracts = "extraction_contracts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
